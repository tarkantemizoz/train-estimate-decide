name: Training checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned runtime and development tools
        run: python -m pip install -r requirements.txt -e ".[dev]"
      - name: Check DynaPlex installation
        run: python -m dynaplex.selftest
      - name: Lint
        run: python -m ruff check ted_tutorial lost_sales_stationary zero_shot_lost_sales_inventory_control tests train.py
      - name: Tests
        run: python -m pytest -q
