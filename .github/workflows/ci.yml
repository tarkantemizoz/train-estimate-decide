name: Training checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the workshop on the validated Ubuntu release during the latest-label migration.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned runtime and development tools
        run: python -m pip install -r requirements.txt -e ".[dev]"
      - name: Check DynaPlex installation
        run: python -m dynaplex.selftest
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q
