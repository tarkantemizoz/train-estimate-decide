[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "train-estimate-decide"
version = "0.1.0"
description = "Train, then Estimate and Decide (TED): lost-sales super-MDPs for DynaPlex 1.14"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = ["dynaplex==1.14.0", "numpy>=2.2,<3", "torch>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.15,<1"]

[tool.setuptools.packages.find]
include = ["envs*"]

[tool.setuptools.package-data]
"envs.lost_sales.cases" = ["*.csv", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["dynaplex"]
