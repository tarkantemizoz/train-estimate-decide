[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dynaplex-stationary-lost-sales"
version = "0.1.0"
description = "Stationary and cyclic zero-shot lost-sales super-MDP ports for DynaPlex 1.14"
requires-python = ">=3.13,<3.14"
dependencies = ["dynaplex==1.14.0", "numpy>=2.2,<3", "torch>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.15,<1", "gymnasium>=1.2,<2"]

[tool.setuptools.packages.find]
include = ["lost_sales_stationary*", "zero_shot_lost_sales_inventory_control*", "ted_tutorial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["dynaplex"]
